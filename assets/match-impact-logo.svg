<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Match Impact">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@700&amp;display=swap');
      .mi-match  { font-family: Inter, 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: 0.42em; fill: #8fa9ae; }
      .mi-impact { font-family: Anton, 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 104px; letter-spacing: 0.02em; fill: #ffffff; }
    </style>
  </defs>

  <!-- Fond + cadre -->
  <rect width="512" height="512" fill="#0b1f24"/>
  <rect x="20" y="20" width="472" height="472" rx="26" fill="#0f262c" stroke="#1f3d44" stroke-width="4"/>

  <!-- Ring (340×260) -->
  <g transform="translate(86 54)">
    <!-- Tablier -->
    <path d="M28 160 L170 202 L170 238 L28 196 Z" fill="#163840"/>
    <path d="M170 202 L312 160 L312 196 L170 238 Z" fill="#0d2329"/>
    <path d="M28 160 L170 202 L312 160" fill="none" stroke="#2b5f6b" stroke-width="2"/>

    <!-- Tapis -->
    <path d="M170 118 L312 160 L170 202 L28 160 Z" fill="#d6e6e9" stroke="#0b1f24" stroke-width="3" stroke-linejoin="round"/>
    <path d="M170 128 L294 160 L170 192 L46 160 Z" fill="none" stroke="#b8cfd3" stroke-width="1.5"/>

    <!-- Cordes du fond -->
    <g stroke="#8fa9ae" stroke-width="3.5" stroke-linecap="round">
      <line x1="28" y1="130" x2="170" y2="88"/>
      <line x1="28" y1="102" x2="170" y2="60"/>
      <line x1="28" y1="74" x2="170" y2="32"/>
      <line x1="170" y1="88" x2="312" y2="130"/>
      <line x1="170" y1="60" x2="312" y2="102"/>
      <line x1="170" y1="32" x2="312" y2="74"/>
    </g>

    <!-- Poteau du fond -->
    <rect x="165" y="20" width="10" height="100" rx="3" fill="#0b1f24"/>
    <rect x="165" y="26" width="10" height="66" rx="3" fill="#2b5f6b"/>

    <!-- Cordes de devant -->
    <g stroke="#e6f1f3" stroke-width="4" stroke-linecap="round">
      <line x1="28" y1="130" x2="170" y2="172"/>
      <line x1="28" y1="102" x2="170" y2="144"/>
      <line x1="28" y1="74" x2="170" y2="116"/>
      <line x1="170" y1="172" x2="312" y2="130"/>
      <line x1="170" y1="144" x2="312" y2="102"/>
      <line x1="170" y1="116" x2="312" y2="74"/>
    </g>

    <!-- Poteaux latéraux -->
    <rect x="22" y="62" width="12" height="100" rx="3" fill="#0b1f24"/>
    <rect x="22" y="68" width="12" height="66" rx="3" fill="#2b5f6b"/>
    <rect x="306" y="62" width="12" height="100" rx="3" fill="#0b1f24"/>
    <rect x="306" y="68" width="12" height="66" rx="3" fill="#2b5f6b"/>

    <!-- Poteau avant -->
    <rect x="163" y="104" width="14" height="100" rx="3" fill="#0b1f24"/>
    <rect x="163" y="110" width="14" height="66" rx="3" fill="#3a7684"/>

    <!-- Tendeurs -->
    <g fill="#0b1f24">
      <circle cx="28" cy="74" r="4"/><circle cx="28" cy="102" r="4"/><circle cx="28" cy="130" r="4"/>
      <circle cx="312" cy="74" r="4"/><circle cx="312" cy="102" r="4"/><circle cx="312" cy="130" r="4"/>
      <circle cx="170" cy="116" r="4.5"/><circle cx="170" cy="144" r="4.5"/><circle cx="170" cy="172" r="4.5"/>
    </g>

    <!-- Capuchons -->
    <g fill="#cfe2e6">
      <rect x="163" y="16" width="14" height="8" rx="3"/>
      <rect x="20" y="58" width="16" height="8" rx="3"/>
      <rect x="304" y="58" width="16" height="8" rx="3"/>
      <rect x="161" y="100" width="18" height="8" rx="3"/>
    </g>

    <!-- Flèches -->
    <g stroke="#0b1f24" stroke-width="3" stroke-linejoin="round">
      <path d="M145.5 84 L183.5 186 L107.5 186 Z" fill="#4ade80"/>
      <path d="M156.5 84 L232.5 84 L194.5 186 Z" fill="#ff6b7f"/>
    </g>
  </g>

  <!-- Texte -->
  <text class="mi-match" x="261.5" y="345" text-anchor="middle">MATCH</text>
  <text class="mi-impact" x="256" y="442" text-anchor="middle">IMPACT</text>
</svg>
